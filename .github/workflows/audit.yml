name: audit
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # build thất bại nếu có cặp tương phản không đạt
      - run: bun run build
      # dist/ và index.html phải khớp với src/ (quên build lại → CI đỏ)
      - run: git diff --exit-code dist/ index.html
